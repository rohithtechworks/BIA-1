<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Home Spoken Centre | Learning Portal</title>
<style>
*{box-sizing:border-box}
:root{--maroon:#ad1035;--navy:#103665;--gold:#d6a64b;--white:#fff}
html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;background:var(--maroon);color:#111}
body{padding:clamp(0px,3.5vw,36px)}
.shell{position:relative;max-width:1050px;min-height:calc(100vh - 48px);margin:0 auto;background:#fff;padding:clamp(16px,3.5vw,36px);overflow:hidden}
h1{margin:0 0 22px;text-align:center;font-size:clamp(32px,7vw,62px);letter-spacing:.12em;font-weight:800}
.page-title{letter-spacing:.03em;font-size:clamp(29px,6vw,52px)}
.menu{display:flex;flex-direction:column;gap:20px}
.card{border:1px solid #111;border-radius:clamp(26px,5vw,46px);overflow:hidden;background:#fff;margin:0 0 24px}
.card-head{display:flex;align-items:center;gap:18px;padding:clamp(22px,4vw,40px);color:#fff}
.person{width:clamp(54px,9vw,82px);height:clamp(54px,9vw,82px);flex:0 0 auto}
.card-copy{flex:1;text-align:center;min-width:0}
.card-title{font-size:clamp(25px,5.8vw,52px);font-weight:400;line-height:1.14}
.progress{font-size:clamp(16px,2.8vw,26px);margin-top:14px}
.card-content{display:flex;flex-direction:column;align-items:center;gap:14px;padding:28px 18px 34px}
.topic{display:block;width:min(100%,490px);padding:14px 22px;border-radius:22px;background:var(--accent);color:#fff;text-decoration:none;font-size:clamp(21px,4.2vw,40px);font-weight:700;line-height:1.25;text-align:left;border:0;cursor:pointer}
.topic:hover,.topic:focus-visible{filter:brightness(1.08);outline:3px solid var(--gold);outline-offset:2px}
.category{display:flex;align-items:center;gap:18px;min-height:clamp(135px,22vw,215px);padding:22px 26px;border:1px solid #111;border-radius:clamp(28px,5vw,46px);color:white;text-decoration:none;transition:transform .16s ease,filter .16s ease}
.category:hover,.category:focus-visible{transform:translateY(-2px);filter:brightness(1.06);outline:3px solid var(--gold);outline-offset:3px}
.relative{background:#103665}.personal{background:#b71945}.official{background:#ff741b}.public{background:#5915e9}.business{background:#05bd68}.fluency{background:#079bb0}
.blue{--accent:#092fd1}.purple{--accent:#6920ad}.red{--accent:#ff3034}.pink{--accent:#ff19a7}
.back{display:inline-flex;align-items:center;gap:8px;text-decoration:none;background:var(--navy);color:white;padding:12px 18px;border-radius:12px;font-size:16px;margin-bottom:22px;border:0;cursor:pointer}
.back:hover{filter:brightness(1.12)}
.panel{border-radius:24px;background:#fafafa;border:1px solid #ddd;padding:clamp(20px,4vw,36px);font-size:18px;line-height:1.6;width:100%}
.panel h2{margin:0 0 8px;color:var(--navy);font-size:clamp(26px,4.5vw,38px)}
.lesson-list{display:grid;gap:12px;margin-top:22px}
.lesson{display:flex;align-items:center;gap:12px;padding:16px 18px;border:1px solid #ddd;border-radius:14px;background:white}
.lesson input,.complete input{width:20px;height:20px;accent-color:var(--navy);flex-shrink:0}
.corner{position:absolute;right:0;bottom:0;width:140px;height:140px;pointer-events:none;background:linear-gradient(135deg,transparent 48%,#103665 49% 54%,#d6a64b 55% 60%,transparent 61%)}
.status{font-size:15px;color:#555;margin-top:10px}
.hidden{display:none!important}

.landing-screen{display:flex;flex-direction:column;align-items:center;gap:18px;min-height:calc(100vh - 72px);padding:0 0 28px}
.landing-poster{display:block;width:100%;max-width:720px;height:auto;object-fit:contain}
.open-course{display:inline-block;border:0;border-radius:14px;background:#103665;color:#fff;padding:16px 42px;font-size:clamp(20px,3.5vw,28px);font-weight:700;cursor:pointer;box-shadow:0 4px 0 #082449}
.open-course:hover,.open-course:focus-visible{background:#174a87;outline:3px solid #d6a64b;outline-offset:3px}


.family-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:22px}
.family-button{display:flex;align-items:center;gap:12px;min-height:92px;border:1px solid #111;border-radius:20px;padding:16px;background:#103665;color:#fff;font-size:clamp(17px,3.2vw,25px);font-weight:700;text-align:left;cursor:pointer}
.family-button:hover,.family-button:focus-visible{filter:brightness(1.12);outline:3px solid #d6a64b;outline-offset:2px}
.family-icon{width:42px;height:42px;flex:0 0 auto}

/* Consistent simple circle-menu theme */
.family-grid{display:flex;flex-direction:column;gap:14px;margin-top:22px}
.family-button{display:flex;align-items:center;justify-content:flex-start;width:100%;min-height:68px;gap:14px;border:1px solid #111;border-radius:22px;padding:14px 22px;background:#103665;color:#fff;font-size:clamp(19px,3.5vw,28px);font-weight:600;text-align:left;cursor:pointer}
.family-button .person{width:38px;height:38px}
.family-button:hover,.family-button:focus-visible{filter:brightness(1.08);outline:3px solid #d6a64b;outline-offset:2px}
.circle-menu-title{margin:0 0 22px;text-align:center;font-size:clamp(30px,6vw,48px);font-weight:700;color:#103665}
.circle-menu-wrap{padding:0!important;border:0!important;background:transparent!important}

@media(max-width:520px){.family-grid{grid-template-columns:1fr}.family-button{min-height:76px}}

@media(max-width:520px){.shell{min-height:100vh;padding:16px 12px}.menu{gap:14px}.category{padding:20px 14px;gap:10px;min-height:130px}.category .person{width:48px;height:48px}.card-head{gap:10px;padding:22px 12px}.card-content{padding:20px 12px 28px}.topic{padding:12px 16px}.corner{transform:scale(.7);transform-origin:bottom right}}
</style>
</head>

 </nav>`;
}
function renderRelativeFamily(){
 const cards=familyMembers.map(m=>`<button type="button" class="family-button" data-family-member="${m.id}">${personSvg}<span>${m.name}</span></button>`).join('');
 return `${backButton('Back to Index','home')}<h1 class="circle-menu-title">Relative Circle</h1><section class="circle-menu-wrap"><div class="family-grid">${cards}</div></section>`;
}
function renderPersonalCircle(){
 const cards=personalMembers.map(m=>`<button type="button" class="family-button" style="background:#103665" data-personal-member="${m.id}">${personSvg}<span>${m.name}</span></button>`).join('');
 return `${backButton('Back to Index','home')}<h1 class="circle-menu-title">Personal Circle</h1><section class="circle-menu-wrap"><div class="family-grid">${cards}</div></section>`;
}
function renderRoleCircle(circleId, title, members, color, intro){
 const cards=members.map(m=>`<button type="button" class="family-button" style="background:#103665" data-role-circle="${circleId}" data-role-member="${m.id}">${personSvg}<span>${m.name}</span></button>`).join('');
 return `${backButton('Back to Index','home')}<h1 class="page-title">${title}</h1><section class="panel"><h2>${title} Practice</h2><p>${intro}</p><div class="family-grid">${cards}</div></section>`;
}
function renderRoleMember(circleId, members, id, color, intro){
 const member=members.find(m=>m.id===id); if(!member)return renderRoleCircle(circleId, circleId, members, color, intro);
 const activities=[
  `Greet the ${member.name.toLowerCase()} politely`,
  `Ask a question and listen to the response`,
  `Explain what you need clearly`,
  `Practise a short conversation`,
  `Close the conversation politely`
 ];
 const checks=readChecks('role-'+circleId+'-'+id);
 return `${backButton('Back to '+circleId.replace(/-/g,' ').replace(/\b\w/g,c=>c.toUpperCase()),circleId)}<h1 class="page-title">${member.name}</h1><section class="panel"><h2>Speaking Practice: ${member.name}</h2><p class="status">Progress: <strong>${checks.filter(Boolean).length}</strong> / ${activities.length}</p><div class="lesson-list">${activities.map((a,i)=>`<label class="lesson"><input type="checkbox" data-role-check="${circleId}" data-role-member-id="${id}" data-check-index="${i}" ${checks[i]?'checked':''}><span>${a}</span></label>`).join('')}</div><p class="status">Your progress is saved in this browser.</p></section>`;
}
function renderOfficialCircle(){
 const cards=officialMembers.map(m=>`<button type="button" class="family-button" style="background:#103665" data-official-member="${m.id}">${personSvg}<span>${m.name}</span></button>`).join('');
 return `${backButton('Back to Index','home')}<h1 class="circle-menu-title">Official Circle</h1><section class="circle-menu-wrap"><div class="family-grid">${cards}</div></section>`;
}
function renderOfficialMember(id){
 const member=officialMembers.find(m=>m.id===id); if(!member)return renderOfficialCircle();
 const activities=[
  `Greet the ${member.name.toLowerCase()} politely`,
  `Ask for information or help`,
  `Explain your situation clearly`,
  `Practise a formal question and answer`,
  `End the conversation respectfully`
 ];
 const checks=readChecks('official-'+id);
 return `${backButton('Back to Official Circle','official-circle')}<h1 class="page-title">${member.name}</h1><section class="panel"><h2>Speaking Practice: ${member.name}</h2><p>Practise polite and formal English for this situation.</p><p class="status">Progress: <strong>${checks.filter(Boolean).length}</strong> / ${activities.length} activities completed</p><div class="lesson-list">${activities.map((a,i)=>`<label class="lesson"><input type="checkbox" data-official-check="${id}" data-check-index="${i}" ${checks[i]?'checked':''}><span>${a}</span></label>`).join('')}</div><p class="status">Your progress is saved in this browser.</p></section>`;
}
function renderPersonalMember(id){
 const member=personalMembers.find(m=>m.id===id); if(!member)return renderPersonalCircle();
 const activities=[
  `Introduce your ${member.name.toLowerCase()}`,
  `Describe your relationship with a ${member.name.toLowerCase()}`,
  `Ask and answer questions about a ${member.name.toLowerCase()}`,
  `Share a memorable experience`,
  `Practise a short conversation`
 ];
 const checks=readChecks('personal-'+id);
 return `${backButton('Back to Personal Circle','personal-circle')}<h1 class="page-title">${member.name}</h1><section class="panel"><h2>Speaking Practice: ${member.name}</h2><p>Complete these activities to practise speaking about people and everyday situations.</p><p class="status">Progress: <strong>${checks.filter(Boolean).length}</strong> / ${activities.length} activities completed</p><div class="lesson-list">${activities.map((a,i)=>`<label class="lesson"><input type="checkbox" data-personal-check="${id}" data-check-index="${i}" ${checks[i]?'checked':''}><span>${a}</span></label>`).join('')}</div><p class="status">Your progress is saved in this browser.</p></section>`;
}
function renderFamilyMember(id){
 const member=familyMembers.find(m=>m.id===id); if(!member)return renderRelativeFamily();
 const activities=[
  `Introduce your ${member.name.toLowerCase()}`,
  `Describe your ${member.name.toLowerCase()}`,
  `Ask and answer questions about your ${member.name.toLowerCase()}`,
  `Talk about a memory with your ${member.name.toLowerCase()}`,
  `Practice a short conversation with your ${member.name.toLowerCase()}`
 ];
 const checks=readChecks('family-'+id);
 return `${backButton('Back to Family Members','relative-family')}<h1 class="page-title">${member.name}</h1><section class="panel"><h2>Speaking Practice: ${member.name}</h2><p>Complete these activities to practise talking about your family in English.</p><p class="status">Progress: <strong>${checks.filter(Boolean).length}</strong> / ${activities.length} activities completed</p><div class="lesson-list">${activities.map((a,i)=>`<label class="lesson"><input type="checkbox" data-family-check="${id}" data-check-index="${i}" ${checks[i]?'checked':''}><span>${a}</span></label>`).join('')}</div><p class="status">Your progress is saved in this browser.</p></section>`;
}
function renderCircle(id){
 const c=circles.find(x=>x.id===id); if(!c)return renderHome();
 const lessonNames=Array.from({length:c.total},(_,i)=>`Lesson ${i+1}: ${c.name}`);
 const checked=readChecks('circle-'+id);
 return `${backButton('Back to Index','home')}<h1 class="page-title">${c.name}</h1><section class="panel"><h2>${c.name}</h2><p>${c.desc}</p><p class="status">Your progress: <strong>${checked.filter(Boolean).length}</strong> / ${c.total} lessons completed</p><div class="lesson-list">${lessonNames.map((n,i)=>`<label class="lesson"><input type="checkbox" data-check-group="circle-${id}" data-check-index="${i}" ${checked[i]?'checked':''}><span>${n}</span></label>`).join('')}</div><p class="status">Select a lesson to mark it complete. Progress is saved in this browser.</p></section>`;
}
function readChecks(key){try{return JSON.parse(localStorage.getItem('hsc-checks-'+key)||'[]')}catch(e){return []}}
function saveCheck(key,index,value){const a=readChecks(key);a[index]=value;try{localStorage.setItem('hsc-checks-'+key,JSON.stringify(a))}catch(e){}}
function renderTopicMenu(title,subtitle,color,topics,backView,backLabel,group){
 return `${backButton(backLabel,backView)}<section class="card"><header class="card-head" style="background:${color}">${personSvg}<div class="card-copy"><div class="card-title">${title}</div><div class="progress">${subtitle}</div></div></header><nav class="card-content">${topics.map((t,i)=>`<button type="button" class="topic" style="--accent:${color}" data-topic="${group}" data-topic-index="${i}">${t}</button>`).join('')}</nav></section>`;
}
function renderQuestionAnswer(){
 return `${backButton('Back to Index','home')}
 ${renderTopicMenu('Question Practice','Progress: '+progressCount('question')+'/33','#ff3034',practiceTopics,'home','Back to Index','question')}
 ${renderTopicMenu('Answer Practice','Progress: '+progressCount('answer')+'/33','#901bb0',practiceTopics,'home','Back to Index','answer')}`;
}
function renderGrammarKeywords(){
 return `${backButton('Back to Index','home')}
 ${renderTopicMenu('Grammar & Tenses','Classes','#092fd1',grammarTopics,'home','Back to Index','grammar')}
 ${renderTopicMenu('Spoken Keywords','Classes','#6920ad',keywordTopics,'home','Back to Index','keywords')}`;
}
function renderPronunciation(){
 return renderTopicMenu('Pronunciation','Classes','#ff19a7',pronunciationTopics,'home','Back to Index','pronunciation');
}
function renderDetail(group,index){
 const lists={question:practiceTopics,answer:practiceTopics,grammar:grammarTopics,keywords:keywordTopics,pronunciation:pronunciationTopics};
 const title=(lists[group]||[])[index]||'Lesson';
 const colors={question:'#ff3034',answer:'#901bb0',grammar:'#092fd1',keywords:'#6920ad',pronunciation:'#ff19a7'};
 const parent={question:'question-answer',answer:'question-answer',grammar:'grammar-keywords',keywords:'grammar-keywords',pronunciation:'pronunciation'}[group];
 const parentLabel={question:'Back to Practice',answer:'Back to Practice',grammar:'Back to Classes',keywords:'Back to Classes',pronunciation:'Back to Pronunciation'}[group];
 const key=`${group}-${index}`;
 const isDone=(()=>{try{return localStorage.getItem('hsc-topic-'+key)==='1'}catch(e){return false}})();
 return `${backButton(parentLabel,parent)}<section class="card"><header class="card-head" style="background:${colors[group]}">${personSvg}<div class="card-copy"><div class="card-title">${title}</div><div class="progress">${group==='question'?'Question Practice':group==='answer'?'Answer Practice':group==='grammar'?'Grammar & Tenses':group==='keywords'?'Spoken Keywords':'Pronunciation'}</div></div></header><div class="card-content"><div class="panel"><h2>${title}</h2><p>This lesson page is ready for your course content, examples, and speaking exercises.</p><p>You can add your actual questions, explanations, audio clips, and practice activities here.</p><label class="lesson complete"><input id="topic-complete" type="checkbox" ${isDone?'checked':''}><span>Mark this topic as completed</span></label><p class="status">Your completion status is saved in this browser.</p></div></div></section>`;
}
function render(){
 let content='';
 switch(currentView.type){
  case 'home': content=renderHome();break;
  case 'circle': content=currentView.id==='relative'?renderRelativeFamily():(currentView.id==='personal'?renderPersonalCircle():(currentView.id==='official'?renderOfficialCircle():(currentView.id==='public'?renderRoleCircle('public-circle','Public Circle',publicMembers,'#5915e9','Practise conversations in public services, workplaces, and community situations.'):(currentView.id==='business'?renderRoleCircle('business-circle','Business Circle',businessMembers,'#05bd68','Practise practical English for shopping, sales, suppliers, deliveries, and business interactions.'):(currentView.id==='fluency'?renderRoleCircle('fluency-circle','Fluency Practice',fluencyMembers,'#079bb0','Build speaking confidence through role-play and everyday conversation scenarios.'):renderCircle(currentView.id))))));break;
  case 'relative-family': content=renderRelativeFamily();break;
  case 'family-member': content=renderFamilyMember(currentView.id);break;
  case 'personal-circle': content=renderPersonalCircle();break;
  case 'personal-member': content=renderPersonalMember(currentView.id);break;
  case 'official-circle': content=renderOfficialCircle();break;
  case 'official-member': content=renderOfficialMember(currentView.id);break;
  case 'public-circle': content=renderRoleCircle('public-circle','Public Circle',publicMembers,'#5915e9','Practise conversations in public services, workplaces, and community situations.');break;
  case 'public-member': content=renderRoleMember('public-circle',publicMembers,currentView.id,'#5915e9','Practise clear and respectful English in this public situation.');break;
  case 'business-circle': content=renderRoleCircle('business-circle','Business Circle',businessMembers,'#05bd68','Practise practical English for shopping, sales, suppliers, deliveries, and business interactions.');break;
  case 'business-member': content=renderRoleMember('business-circle',businessMembers,currentView.id,'#05bd68','Practise practical English for this business situation.');break;
  case 'fluency-circle': content=renderRoleCircle('fluency-circle','Fluency Practice',fluencyMembers,'#079bb0','Build speaking confidence through role-play and everyday conversation scenarios.');break;
  case 'fluency-member': content=renderRoleMember('fluency-circle',fluencyMembers,currentView.id,'#079bb0','Practise fluency with this role-play scenario.');break;
  case 'question-answer': content=renderQuestionAnswer();break;
  case 'grammar-keywords': content=renderGrammarKeywords();break;
  case 'pronunciation': content=renderPronunciation();break;
  case 'detail': content=renderDetail(currentView.group,currentView.index);break;
  default: content=renderHome();
 }
 app.innerHTML=content;
 app.querySelectorAll('[data-back]').forEach(el=>el.addEventListener('click',()=>go({type:el.dataset.back})));
 app.querySelectorAll('[data-open-circle]').forEach(el=>el.addEventListener('click',()=>go({type:'circle',id:el.dataset.openCircle})));
 app.querySelectorAll('[data-family-member]').forEach(el=>el.addEventListener('click',()=>go({type:'family-member',id:el.dataset.familyMember})));
 app.querySelectorAll('[data-personal-member]').forEach(el=>el.addEventListener('click',()=>go({type:'personal-member',id:el.dataset.personalMember})));
 app.querySelectorAll('[data-official-member]').forEach(el=>el.addEventListener('click',()=>go({type:'official-member',id:el.dataset.officialMember})));
 app.querySelectorAll('[data-role-circle]').forEach(el=>el.addEventListener('click',()=>{
  const circle=el.dataset.roleCircle, id=el.dataset.roleMember;
  const type=circle==='public-circle'?'public-member':circle==='business-circle'?'business-member':'fluency-member';
  go({type,id});
 }));
 app.querySelectorAll('[data-role-check]').forEach(el=>el.addEventListener('change',()=>{
  saveCheck('role-'+el.dataset.roleCheck+'-'+el.dataset.roleMemberId,Number(el.dataset.checkIndex),el.checked);
  const count=readChecks('role-'+el.dataset.roleCheck+'-'+el.dataset.roleMemberId).filter(Boolean).length;
  const p=app.querySelector('.status strong');if(p)p.textContent=count;
 }));
 app.querySelectorAll('[data-official-check]').forEach(el=>el.addEventListener('change',()=>{
  saveCheck('official-'+el.dataset.officialCheck,Number(el.dataset.checkIndex),el.checked);
  const count=readChecks('official-'+el.dataset.officialCheck).filter(Boolean).length;
  const p=app.querySelector('.status strong');if(p)p.textContent=count;
 }));
 app.querySelectorAll('[data-personal-check]').forEach(el=>el.addEventListener('change',()=>{
  saveCheck('personal-'+el.dataset.personalCheck,Number(el.dataset.checkIndex),el.checked);
  const count=readChecks('personal-'+el.dataset.personalCheck).filter(Boolean).length;
  const p=app.querySelector('.status strong');if(p)p.textContent=count;
 }));
 app.querySelectorAll('[data-family-check]').forEach(el=>el.addEventListener('change',()=>{
  saveCheck('family-'+el.dataset.familyCheck,Number(el.dataset.checkIndex),el.checked);
  const count=readChecks('family-'+el.dataset.familyCheck).filter(Boolean).length;
  const p=app.querySelector('.status strong');if(p)p.textContent=count;
 }));
 app.querySelectorAll('[data-open]').forEach(el=>el.addEventListener('click',()=>go({type:el.dataset.open})));
 app.querySelectorAll('[data-topic]').forEach(el=>el.addEventListener('click',()=>go({type:'detail',group:el.dataset.topic,index:Number(el.dataset.topicIndex)})));
 app.querySelectorAll('[data-check-group]').forEach(el=>el.addEventListener('change',()=>{
  saveCheck(el.dataset.checkGroup,Number(el.dataset.checkIndex),el.checked);
  const c=circles.find(x=>x.id===currentView.id);
  const count=readChecks('circle-'+currentView.id).filter(Boolean).length;
  const p=app.querySelector('.status strong');if(p)p.textContent=count;
  setProgress(currentView.id,count);
 }));
 const topicCheck=app.querySelector('#topic-complete');
 if(topicCheck)topicCheck.addEventListener('change',()=>{
  const {group,index}=currentView;try{localStorage.setItem('hsc-topic-'+group+'-'+index,topicCheck.checked?'1':'0')}catch(e){}
  if(group==='question'||group==='answer'){
   const done=practiceTopics.reduce((n,_,i)=>{try{return n+(localStorage.getItem('hsc-topic-'+group+'-'+i)==='1'?1:0)}catch(e){return n}},0);
   setProgress(group,done);
  }
 });
}
render();
const landing=document.getElementById('landing');
const appRoot=document.getElementById('app');
document.getElementById('open-course').addEventListener('click',()=>{
  landing.classList.add('hidden');
  appRoot.classList.remove('hidden');
  window.scrollTo({top:0,behavior:'smooth'});
});
</script>
</body>
</html>
